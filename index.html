<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inventory</title>
<meta name="description" content="Local-first inventory for workshop storage." />
<meta name="theme-color" content="#14171c" />
<meta name="color-scheme" content="dark light" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="live-region" aria-live="polite" class="sr-only"></div>

<div id="app" data-density="comfortable">
  <header class="app-header">
    <span class="app-logo" data-icon="items" data-icon-size="22"></span>
    <h1 class="app-title" data-i18n="app.name"></h1>
  </header>

  <main id="view-container">

    <!-- ===== Tab views (replace history) ===== -->

    <section id="view-search" class="view view-tab" data-view>
      <h1 data-i18n="view.search.title"></h1>
      <div class="row" style="align-items: center; gap: 8px">
        <input type="search" id="search-input" class="search-input grow" data-i18n-placeholder="search.placeholder" autocomplete="off" autocorrect="off" style="margin-bottom: 0" />
        <button type="button" class="btn-icon search-photo-toggle" id="search-photo-toggle" data-i18n-aria="search.photoToggle" aria-pressed="false"><span data-icon="camera"></span></button>
        <button type="button" class="btn-icon search-photo-toggle" id="search-photo-size-toggle" hidden data-i18n-aria="search.photoSizeToggle" aria-pressed="false"><span data-icon="expand"></span></button>
      </div>

      <div id="search-results" hidden></div>

      <div id="search-browse">
        <div class="field-row" style="margin-bottom: 8px">
          <select id="search-room-filter" class="grow"></select>
          <select id="search-storage-filter" class="grow" disabled></select>
          <select id="search-section-filter" class="grow" disabled></select>
        </div>
        <div class="row" style="margin-bottom: 12px">
          <select id="search-category-filter" class="grow"></select>
        </div>
        <div class="section-label" id="search-browse-label"></div>
        <div class="list" id="search-skeleton" hidden></div>
        <div class="list" id="search-container-list"></div>
        <p class="empty-state" id="search-browse-empty" hidden></p>
      </div>
    </section>

    <section id="view-items" class="view view-tab" data-view hidden>
      <h1 data-i18n="view.items.title"></h1>
      <input type="search" id="items-search" class="search-input" data-i18n-placeholder="items.filterPlaceholder" autocomplete="off" autocorrect="off" />
      <div class="field-row" style="margin-bottom: 12px">
        <select id="items-category-filter" class="grow"></select>
        <select id="items-state-filter" class="grow">
          <option value="" data-i18n="items.state.all"></option>
          <option value="confirmed" data-i18n="items.state.confirmed"></option>
          <option value="draft" data-i18n="items.state.draft"></option>
        </select>
      </div>
      <div class="row" style="justify-content: space-between; margin-bottom: 10px">
        <p class="muted" id="items-count" style="margin: 0"></p>
        <select id="items-sort" style="width: auto">
          <option value="updatedAt-desc" data-i18n="sort.updatedDesc"></option>
          <option value="title-asc" data-i18n="sort.titleAsc"></option>
          <option value="quantity-desc" data-i18n="sort.quantityDesc"></option>
        </select>
      </div>
      <div class="list" id="items-skeleton" hidden></div>
      <div class="list" id="items-list"></div>
      <p class="empty-state" id="items-empty" hidden data-i18n="items.empty"></p>
    </section>

    <section id="view-capture" class="view view-tab" data-view hidden>
      <h1 data-i18n="view.capture.title"></h1>

      <label class="field field-combo">
        <span data-i18n="capture.selectContainer"></span>
        <input type="text" id="capture-container-input" autocomplete="off" autocapitalize="characters" data-i18n-placeholder="capture.searchContainer" />
        <div class="combo-list" id="capture-container-list" hidden></div>
      </label>
      <button class="btn btn-block" id="capture-new-container-btn" data-i18n="capture.newContainer" style="margin: 8px 0 12px"></button>
      <div id="capture-new-container-form" class="card" hidden>
        <h2 data-i18n="capture.newContainer"></h2>
        <div class="field-row">
          <label class="field" style="max-width: 110px">
            <span data-i18n="search.codePrefix"></span>
            <input type="text" id="capture-new-prefix" autocapitalize="characters" />
          </label>
          <label class="field grow">
            <span data-i18n="detail.code"></span>
            <input type="text" id="capture-new-code" autocapitalize="characters" />
          </label>
        </div>
        <label class="field">
          <span data-i18n="detail.name"></span>
          <input type="text" id="capture-new-name" />
        </label>
        <label class="field">
          <span data-i18n="detail.location"></span>
          <select id="capture-new-location"></select>
        </label>
        <div class="row">
          <button class="btn btn-primary grow" id="capture-new-create" data-i18n="action.create"></button>
          <button class="btn" id="capture-new-cancel" data-i18n="action.cancel"></button>
        </div>
        <p class="error-text" id="capture-new-error" hidden></p>
      </div>

      <div id="capture-photo-section" hidden>
        <div class="section-label" id="capture-photo-label"></div>
        <!-- No `capture` attribute: on iOS Safari that forces the camera
             open directly, skipping the OS action sheet's own "Photo
             Library" option entirely — accept="image/*" alone still
             offers Take Photo AND Photo Library. -->
        <input type="file" id="capture-photo-input" accept="image/*" multiple hidden />
        <button class="btn btn-block" id="capture-photo-add-btn" data-i18n="capture.addPhotos" style="margin-bottom: 12px"></button>
        <div class="capture-photo-grid" id="capture-photo-grid"></div>
        <p class="empty-state" id="capture-photo-empty" data-i18n="capture.photoEmpty"></p>
        <button class="btn btn-block btn-primary" id="capture-done-btn" data-i18n="capture.done" style="margin-top: 16px"></button>
      </div>
    </section>

    <section id="view-review" class="view view-tab" data-view hidden>
      <h1 data-i18n="view.review.title"></h1>

      <div class="section-label" data-i18n="review.queueLabel"></div>
      <label class="row" id="review-show-identified-row" style="margin-bottom: 10px; align-items: center; gap: 8px">
        <input type="checkbox" id="review-show-identified-toggle" style="width: auto" />
        <span data-i18n="review.showIdentified"></span>
      </label>
      <p class="empty-state" id="review-queue-empty" hidden data-i18n="review.queueEmpty"></p>
      <p class="empty-state" id="review-queue-filtered-empty" hidden data-i18n="review.queueFilteredEmpty"></p>
      <p class="muted" id="review-no-api-key" hidden>
        <span data-i18n="review.noApiKey"></span>
        <button type="button" class="btn btn-sm" id="review-no-api-key-btn" data-i18n="review.openSettings"></button>
      </p>
      <div class="list" id="review-queue-skeleton" hidden></div>
      <div class="list" id="review-queue-list"></div>
      <div id="review-batch-bar" class="review-batch-bar" hidden>
        <span id="review-batch-count"></span>
        <span class="muted" id="review-batch-cost"></span>
        <button type="button" class="btn btn-primary" id="review-batch-run-btn" data-i18n="review.identify"></button>
      </div>

      <div class="section-label" style="margin-top: 24px" data-i18n="review.draftsLabel"></div>
      <p class="empty-state" id="review-drafts-empty" data-i18n="review.draftsEmpty"></p>
      <div id="review-drafts-list"></div>
    </section>

    <section id="view-more" class="view view-tab" data-view hidden>
      <h1 data-i18n="view.more.title"></h1>
      <div class="more-list">
        <button class="more-row" data-nav-push="view-locations">
          <span class="more-row-icon" data-icon="pin"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.locations.title"></span>
            <span class="more-row-sub" data-i18n="more.locations.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-bulk-containers">
          <span class="more-row-icon" data-icon="items"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.bulkContainers.title"></span>
            <span class="more-row-sub" data-i18n="more.bulkContainers.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-labels">
          <span class="more-row-icon" data-icon="tag"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.labels.title"></span>
            <span class="more-row-sub" data-i18n="more.labels.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-report">
          <span class="more-row-icon" data-icon="chart"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.report.title"></span>
            <span class="more-row-sub" data-i18n="more.report.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-trash">
          <span class="more-row-icon" data-icon="trash"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.trash.title"></span>
            <span class="more-row-sub" data-i18n="more.trash.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-synclog">
          <span class="more-row-icon" data-icon="history"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.synclog.title"></span>
            <span class="more-row-sub" data-i18n="more.synclog.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-settings">
          <span class="more-row-icon" data-icon="settings"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.settings.title"></span>
            <span class="more-row-sub" data-i18n="more.settings.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-help">
          <span class="more-row-icon" data-icon="help"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.help.title"></span>
            <span class="more-row-sub" data-i18n="more.help.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
        <button class="more-row" data-nav-push="view-about">
          <span class="more-row-icon" data-icon="info"></span>
          <span class="more-row-text">
            <span class="more-row-title" data-i18n="view.about.title"></span>
            <span class="more-row-sub" data-i18n="more.about.sub"></span>
          </span>
          <span class="more-row-chevron" data-icon="chevronRight"></span>
        </button>
      </div>
    </section>

    <!-- ===== Pushed views (push history, animate forward) ===== -->

    <section id="view-detail" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <input type="text" id="detail-code" class="detail-code-input" autocapitalize="characters" />
        <span id="detail-status-badge" class="badge" style="margin-left: auto"></span>
      </header>
      <div class="detail-nav-bar" id="detail-nav-bar" hidden>
        <button type="button" class="btn-icon" id="detail-nav-prev" data-i18n-aria="detail.navPrev"><span data-icon="chevronLeft"></span></button>
        <span id="detail-nav-position" class="detail-nav-position"></span>
        <button type="button" class="btn-icon" id="detail-nav-next" data-i18n-aria="detail.navNext"><span data-icon="chevronRight"></span></button>
      </div>
      <div class="view-body" id="detail-body">
        <p class="empty-state" id="detail-not-found" hidden data-i18n="detail.notFound"></p>
        <div id="detail-content" hidden>
          <p class="error-text" id="detail-code-error" hidden></p>
          <div class="card">
            <label class="field">
              <span data-i18n="detail.name"></span>
              <input type="text" id="detail-title" maxlength="60" />
            </label>
            <label class="field">
              <span data-i18n="detail.location"></span>
              <select id="detail-location"></select>
            </label>
            <label class="field" style="margin-bottom: 0">
              <span data-i18n="detail.notes"></span>
              <textarea id="detail-notes"></textarea>
            </label>
          </div>

          <div class="capture-photo-grid" id="detail-photo-grid" style="margin-bottom: 16px"></div>

          <input type="file" id="detail-photo-input" accept="image/*" multiple hidden />
          <button class="btn btn-block" id="detail-photo-add-btn" data-i18n="capture.addPhotos" style="margin-bottom: 8px"></button>
          <label class="row" id="detail-photo-ai-row" style="margin-bottom: 16px; align-items: center; gap: 8px">
            <input type="checkbox" id="detail-photo-ai-toggle" style="width: auto" checked />
            <span data-i18n="detail.addPhotosAiToggle"></span>
          </label>

          <p class="muted" id="detail-identify-no-key" hidden data-i18n="review.noApiKey"></p>
          <button class="btn btn-block" id="detail-identify-settings-btn" hidden data-i18n="review.openSettings" style="margin-bottom: 16px"></button>
          <button class="btn btn-block" id="detail-identify-btn" hidden data-i18n="review.identify" style="margin-bottom: 16px"></button>

          <button class="btn btn-primary btn-block" id="detail-confirm-btn" hidden style="margin-bottom: 16px"></button>

          <div class="section-label" id="detail-items-label"></div>
          <p class="empty-state" id="detail-items-empty" hidden data-i18n="detail.itemsEmpty"></p>
          <div class="list" id="detail-items-list"></div>

          <div id="detail-item-form" class="card" hidden>
            <label class="field">
              <span data-i18n="item.description"></span>
              <input type="text" id="new-item-title" maxlength="100" />
            </label>
            <div class="field-row">
              <label class="field" style="max-width: 90px">
                <span>#</span>
                <input type="text" id="new-item-quantity" inputmode="numeric" value="1" />
              </label>
              <label class="field grow">
                <span data-i18n="item.category"></span>
                <input type="text" id="new-item-category" list="category-options" />
              </label>
            </div>
            <label class="field">
              <span data-i18n="item.link"></span>
              <input type="text" id="new-item-link" autocapitalize="none" placeholder="https://…" />
            </label>
            <div class="item-fields-list" id="new-item-fields-list"></div>
            <button type="button" class="btn btn-sm" id="new-item-field-add-btn" data-i18n="item.addSpec" style="margin-bottom: 12px"></button>
            <div class="row">
              <button class="btn btn-primary grow" id="new-item-save" data-i18n="action.add"></button>
              <button class="btn" id="new-item-cancel" data-i18n="action.cancel"></button>
            </div>
          </div>
          <button class="btn btn-block" id="detail-add-item-btn" data-i18n="detail.addItem" style="margin-bottom: 24px"></button>

          <button class="btn btn-block" id="detail-print-btn" data-i18n="detail.printContainer" style="margin-bottom: 12px"></button>

          <button class="btn btn-block" id="detail-copy-btn" data-i18n="detail.copyItems" style="margin-bottom: 12px"></button>
          <div id="detail-copy-form" class="card" hidden>
            <label class="field">
              <span data-i18n="detail.copyTarget"></span>
              <select id="detail-copy-target-select"></select>
            </label>
            <div id="detail-copy-new-fields" hidden>
              <div class="field-row">
                <label class="field" style="max-width: 110px">
                  <span data-i18n="search.codePrefix"></span>
                  <input type="text" id="detail-copy-new-prefix" autocapitalize="characters" />
                </label>
                <label class="field grow">
                  <span data-i18n="detail.code"></span>
                  <input type="text" id="detail-copy-new-code" autocapitalize="characters" />
                </label>
              </div>
              <label class="field">
                <span data-i18n="detail.name"></span>
                <input type="text" id="detail-copy-new-name" />
              </label>
              <label class="field">
                <span data-i18n="detail.location"></span>
                <select id="detail-copy-new-location"></select>
              </label>
            </div>
            <div class="row">
              <button type="button" class="btn btn-primary grow" id="detail-copy-confirm-btn" data-i18n="detail.copyConfirm"></button>
              <button type="button" class="btn" id="detail-copy-cancel-btn" data-i18n="action.cancel"></button>
            </div>
            <p class="error-text" id="detail-copy-error" hidden></p>
          </div>

          <div class="danger-zone">
            <button class="btn btn-block btn-danger" id="detail-delete-btn" data-i18n="detail.deleteContainer"></button>
          </div>
        </div>
      </div>
    </section>

    <section id="view-locations" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.locations.title"></h1>
      </header>
      <div class="view-body">
        <button class="btn btn-block" id="location-add-btn" data-i18n="locations.add"></button>
        <div id="location-form" class="card" hidden>
          <label class="field">
            <span data-i18n="locations.room"></span>
            <input type="text" id="location-room" list="location-room-options" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="locations.storage"></span>
            <input type="text" id="location-storage" list="location-storage-options" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="locations.section"></span>
            <input type="text" id="location-section" list="location-section-options" autocomplete="off" />
          </label>
          <label class="field" id="location-name-field" style="margin-bottom: 0">
            <span data-i18n="locations.name"></span>
            <input type="text" id="location-name" list="location-name-options" autocomplete="off" />
          </label>

          <label class="row" id="location-range-toggle-row" style="margin-top: 12px; align-items: center; gap: 8px">
            <input type="checkbox" id="location-range-toggle" style="width: auto" />
            <span data-i18n="locations.range.toggle"></span>
          </label>
          <div class="field-row" id="location-range-fields" hidden style="margin-top: 8px">
            <label class="field">
              <span data-i18n="locations.range.from"></span>
              <input type="text" id="location-range-from" inputmode="numeric" value="1" />
            </label>
            <label class="field">
              <span data-i18n="locations.range.to"></span>
              <input type="text" id="location-range-to" inputmode="numeric" value="5" />
            </label>
          </div>
          <p class="muted" id="location-range-hint" hidden data-i18n="locations.range.hint"></p>

          <div class="row" style="margin-top: 12px">
            <button class="btn btn-primary grow" id="location-save" data-i18n="action.save"></button>
            <button class="btn" id="location-cancel" data-i18n="action.cancel"></button>
          </div>
          <div class="row" id="location-edit-actions" hidden style="margin-top: 8px">
            <button class="btn grow" id="location-copy-btn" data-i18n="locations.copy"></button>
            <button class="btn btn-danger" id="location-delete-btn" data-i18n="action.delete"></button>
          </div>
          <p class="error-text" id="location-error" hidden></p>
        </div>
        <div id="location-groups"></div>
        <p class="empty-state" id="locations-empty" hidden data-i18n="locations.empty"></p>
      </div>
    </section>

    <datalist id="location-room-options"></datalist>
    <datalist id="location-storage-options"></datalist>
    <datalist id="location-section-options"></datalist>
    <datalist id="location-name-options"></datalist>

    <section id="view-bulk-containers" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.bulkContainers.title"></h1>
      </header>
      <div class="view-body">
        <div class="card">
          <label class="field" style="max-width: 160px">
            <span data-i18n="search.codePrefix"></span>
            <input type="text" id="bulk-containers-prefix" autocapitalize="characters" value="BOX" />
          </label>
          <div class="field-row">
            <label class="field">
              <span data-i18n="locations.range.from"></span>
              <input type="text" id="bulk-containers-from" inputmode="numeric" />
            </label>
            <label class="field">
              <span data-i18n="locations.range.to"></span>
              <input type="text" id="bulk-containers-to" inputmode="numeric" />
            </label>
          </div>
          <p class="muted" data-i18n="bulkContainers.hint"></p>
          <button class="btn btn-primary btn-block" id="bulk-containers-create" data-i18n="action.create"></button>
          <p class="error-text" id="bulk-containers-error" hidden></p>
        </div>
      </div>
    </section>

    <section id="view-labels" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.labels.title"></h1>
      </header>
      <div class="view-body">
        <p class="empty-state" id="labels-empty" hidden data-i18n="labels.empty"></p>
        <label class="row" id="labels-select-all-row" style="margin-bottom: 10px; align-items: center; gap: 8px">
          <input type="checkbox" id="labels-select-all" style="width: auto" />
          <span data-i18n="labels.selectAll"></span>
        </label>
        <div class="list" id="labels-list"></div>
        <label class="field" style="margin-top: 16px">
          <span data-i18n="labels.format.label"></span>
          <select id="labels-format-select"></select>
        </label>
        <label class="field" style="margin-bottom: 0">
          <span data-i18n="labels.skipCount.label"></span>
          <input type="number" id="labels-skip-input" min="0" step="1" value="0" inputmode="numeric" />
        </label>
        <p class="muted" data-i18n="labels.skipCount.hint" style="margin-top: 4px"></p>
        <button class="btn btn-block btn-primary" id="labels-print-btn" data-i18n="labels.print" style="margin-top: 16px"></button>
      </div>
    </section>

    <section id="view-report" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.report.title"></h1>
      </header>
      <div class="view-body">
        <div class="stat-grid">
          <div class="stat-tile"><span class="stat-value" id="report-stat-locations"></span><span class="stat-label" data-i18n="report.stats.locations"></span></div>
          <div class="stat-tile"><span class="stat-value" id="report-stat-containers"></span><span class="stat-label" data-i18n="report.stats.containers"></span></div>
          <div class="stat-tile"><span class="stat-value" id="report-stat-items"></span><span class="stat-label" data-i18n="report.stats.items"></span></div>
          <div class="stat-tile"><span class="stat-value" id="report-stat-pinned"></span><span class="stat-label" data-i18n="report.stats.pinned"></span></div>
          <div class="stat-tile"><span class="stat-value" id="report-stat-drafts"></span><span class="stat-label" data-i18n="report.stats.drafts"></span></div>
        </div>

        <div class="section-label" data-i18n="report.categories.title"></div>
        <div id="report-categories" class="category-bars"></div>
        <p class="empty-state" id="report-categories-empty" hidden data-i18n="report.categories.empty"></p>

        <div class="section-label" data-i18n="report.activity.title"></div>
        <div id="report-chart" class="chart-container"></div>

        <div class="section-label" data-i18n="report.tags.title"></div>
        <div id="report-tags" class="tag-cloud"></div>
        <p class="empty-state" id="report-tags-empty" hidden data-i18n="report.tags.empty"></p>

        <div class="section-label" data-i18n="report.export.title"></div>
        <button class="btn btn-block" id="report-export-json-btn" data-i18n="report.export.json" style="margin-bottom: 10px"></button>
        <button class="btn btn-block" id="report-export-csv-btn" data-i18n="report.export.csv" style="margin-bottom: 10px"></button>
        <button class="btn btn-block btn-primary" id="report-print-btn" data-i18n="report.print.button"></button>
      </div>
    </section>

    <section id="view-settings" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.settings.title"></h1>
      </header>
      <div class="view-body">
        <section class="settings-section" id="install-panel" hidden>
          <h2 data-i18n="install.title"></h2>
          <p class="muted" id="install-hint"></p>
          <div class="row" style="margin-top: 10px">
            <button class="btn btn-primary grow" id="install-btn" data-i18n="install.action" hidden></button>
            <button class="btn" id="install-dismiss-btn" data-i18n="install.dismiss"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.appearance"></h2>
          <div class="field-label" data-i18n="settings.theme"></div>
          <div class="seg" data-theme-picker>
            <button class="seg-btn" data-theme-choice="auto" data-i18n="settings.theme.auto"></button>
            <button class="seg-btn" data-theme-choice="dark" data-i18n="settings.theme.dark"></button>
            <button class="seg-btn" data-theme-choice="light" data-i18n="settings.theme.light"></button>
            <button class="seg-btn" data-theme-choice="midnight" data-i18n="settings.theme.midnight"></button>
            <button class="seg-btn" data-theme-choice="paper" data-i18n="settings.theme.paper"></button>
            <button class="seg-btn" data-theme-choice="industrial" data-i18n="settings.theme.industrial"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.language"></h2>
          <div class="seg" data-lang-picker>
            <button class="seg-btn" data-lang-choice="nl" data-i18n="settings.language.nl"></button>
            <button class="seg-btn" data-lang-choice="en" data-i18n="settings.language.en"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.density"></h2>
          <div class="seg" data-density-picker>
            <button class="seg-btn" data-density-choice="comfortable" data-i18n="settings.density.comfortable"></button>
            <button class="seg-btn" data-density-choice="compact" data-i18n="settings.density.compact"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.sync.title"></h2>
          <p class="muted" id="sync-status"></p>

          <button class="btn btn-block btn-primary" id="sync-now-btn" data-i18n="settings.sync.now" style="margin-top: 8px"></button>
          <button class="btn btn-block" id="sync-backup-btn" data-i18n="settings.sync.backupNow" style="margin-top: 10px"></button>
          <button class="btn btn-block" id="sync-restore-toggle-btn" data-i18n="settings.sync.showBackups" style="margin-top: 10px"></button>
          <div id="sync-restore-list" class="list" hidden style="margin-top: 10px"></div>
          <p class="empty-state" id="sync-restore-empty" hidden data-i18n="settings.sync.noBackups"></p>

          <button class="btn btn-block" id="sync-disconnect-btn" data-i18n="settings.sync.disconnect" style="margin-top: 16px"></button>

          <!-- Client ID + registered origin/redirect: setup-only fields that
               are easy to brush against while scrolling to the everyday
               actions above — tucked behind an explicit toggle so they're
               never one careless tap away from being overwritten. -->
          <button class="btn btn-block" id="sync-advanced-toggle-btn" data-i18n="settings.advancedToggle" style="margin-top: 16px"></button>
          <div id="sync-advanced-panel" hidden style="margin-top: 10px">
            <label class="field">
              <span data-i18n="settings.sync.clientId"></span>
              <input type="text" id="sync-clientid-input" autocapitalize="none" autocomplete="off" placeholder="123...abc.apps.googleusercontent.com" />
            </label>
            <button class="btn" id="sync-clientid-save-btn" data-i18n="action.save" style="margin-bottom: 14px"></button>

            <div class="field-label" data-i18n="settings.sync.registerValues"></div>
            <label class="field">
              <span data-i18n="settings.sync.origin"></span>
              <input type="text" id="sync-origin-value" readonly />
            </label>
            <label class="field" style="margin-bottom: 0">
              <span data-i18n="settings.sync.redirectUri"></span>
              <input type="text" id="sync-redirect-value" readonly />
            </label>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.storage.title"></h2>
          <p class="muted" id="settings-storage-usage"></p>
          <div class="storage-bar"><div class="storage-bar-fill" id="settings-storage-bar-fill"></div></div>
          <p class="muted" id="settings-storage-persist-status"></p>
          <button class="btn btn-block" id="settings-storage-persist-btn" data-i18n="settings.storage.persistBtn" style="margin-top: 8px"></button>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.history.title"></h2>
          <p class="muted" data-i18n="settings.history.hint"></p>
          <div id="settings-history-list" style="margin-top: 10px"></div>
          <p class="empty-state" id="settings-history-empty" hidden data-i18n="settings.history.empty"></p>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.ai.title"></h2>
          <p class="muted" data-i18n="settings.ai.hint"></p>
          <p class="muted" id="ai-apikey-status"></p>

          <!-- The API key is the only thing this section has to protect —
               same reasoning as Sync's toggle above. -->
          <button class="btn btn-block" id="ai-advanced-toggle-btn" data-i18n="settings.advancedToggle" style="margin-top: 8px"></button>
          <div id="ai-advanced-panel" hidden style="margin-top: 10px">
            <label class="field">
              <span data-i18n="settings.ai.apiKey"></span>
              <input type="password" id="ai-apikey-input" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." />
            </label>
            <button class="btn" id="ai-apikey-save-btn" data-i18n="action.save" style="margin-bottom: 8px"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 data-i18n="settings.danger.title"></h2>
          <p class="muted" data-i18n="settings.danger.hint"></p>
          <button class="btn btn-block btn-danger" id="wipe-data-btn" data-i18n="settings.danger.wipeBtn" style="margin-top: 10px"></button>
        </section>
      </div>
    </section>

    <section id="view-trash" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.trash.title"></h1>
      </header>
      <div class="view-body">
        <div class="list" id="trash-list"></div>
        <p class="empty-state" id="trash-empty" hidden data-i18n="trash.empty"></p>
      </div>
    </section>

    <section id="view-synclog" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.synclog.title"></h1>
      </header>
      <div class="view-body">
        <div id="synclog-list"></div>
        <p class="empty-state" id="synclog-empty" hidden data-i18n="synclog.empty"></p>
        <button class="btn btn-block" id="synclog-clear-btn" data-i18n="synclog.clear" hidden></button>
      </div>
    </section>

    <section id="view-help" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.help.title"></h1>
      </header>
      <div class="view-body">
        <div id="help-content" class="markdown-content"></div>
      </div>
    </section>

    <section id="view-about" class="view view-pushed" data-view hidden>
      <header class="view-header">
        <button class="btn-icon" data-nav-back data-i18n-aria="nav.back"><span data-icon="back"></span></button>
        <h1 data-i18n="view.about.title"></h1>
      </header>
      <div class="view-body">
        <p id="about-designed-line" class="about-line"></p>
        <p id="about-build-line" class="about-line muted"></p>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab-btn" data-nav-tab="view-search">
      <span class="tab-icon" data-icon="search"></span>
      <span class="tab-label" data-i18n="tab.search"></span>
    </button>
    <button class="tab-btn" data-nav-tab="view-items">
      <span class="tab-icon" data-icon="items"></span>
      <span class="tab-label" data-i18n="tab.items"></span>
    </button>
    <button class="tab-btn" data-nav-tab="view-capture">
      <span class="tab-icon" data-icon="camera"></span>
      <span class="tab-label" data-i18n="tab.capture"></span>
    </button>
    <button class="tab-btn" data-nav-tab="view-review">
      <span class="tab-icon" data-icon="review"></span>
      <span class="tab-label" data-i18n="tab.review"></span>
    </button>
    <button class="tab-btn" data-nav-tab="view-more">
      <span class="tab-icon" data-icon="more"></span>
      <span class="tab-label" data-i18n="tab.more"></span>
    </button>
  </nav>
</div>

<datalist id="category-options"></datalist>
<div id="toast-root"></div>
<div id="dialog-root"></div>
<div id="print-root" class="print-report"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
