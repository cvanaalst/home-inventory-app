<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inventory — tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: #14171c; color: #e8eaed; margin: 0; padding: 24px; }
  h1 { font-family: -apple-system, sans-serif; font-size: 20px; margin: 0 0 4px; }
  h2 { font-family: -apple-system, sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #a8adb8; margin: 28px 0 8px; border-bottom: 1px solid #2e3440; padding-bottom: 4px; }
  #summary { position: sticky; top: 0; background: #1b1f26; border: 1px solid #2e3440; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px; }
  #summary.all-pass { border-color: #4ade80; }
  #summary.has-fail { border-color: #f87171; }
  .row { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  .pass { color: #4ade80; }
  .fail { color: #f87171; font-weight: 600; }
  .detail { color: #6b7280; margin-left: 20px; }
</style>
</head>
<body>
<h1>Inventory — unit tests</h1>
<div id="summary">Running…</div>
<div id="results"></div>

<script type="module">
import * as db from "./db.js";
import { dictionaryKeys } from "./i18n.js";
import { render } from "./markdown.js";
import * as report from "./report.js";
import * as merge from "./merge.js";
import { parseItemsPayload, buildMultipartBody } from "./sync.js";

const results = document.getElementById("results");
let pass = 0;
let fail = 0;
let currentSection = null;

function section(name) {
  currentSection = name;
  const h = document.createElement("h2");
  h.textContent = name;
  results.appendChild(h);
}

function stableStringify(v) {
  return JSON.stringify(v, (_, val) => {
    if (val && typeof val === "object" && !Array.isArray(val)) {
      return Object.keys(val)
        .sort()
        .reduce((acc, k) => ((acc[k] = val[k]), acc), {});
    }
    return val;
  });
}

/** assertEqual(actual, expected, label) — deep-compares actual vs expected
 * (key order ignored for objects) and renders a PASS/FAIL row. `label`
 * should say *why* this must hold, not just what is being checked. */
function assertEqual(actual, expected, label) {
  const ok = stableStringify(actual) === stableStringify(expected);
  const row = document.createElement("div");
  row.className = "row";
  if (ok) {
    pass++;
    row.innerHTML = `<span class="pass">PASS</span> ${label}`;
  } else {
    fail++;
    row.innerHTML =
      `<span class="fail">FAIL</span> ${label}\n` +
      `<span class="detail">expected: ${stableStringify(expected)}\n         actual: ${stableStringify(actual)}</span>`;
  }
  results.appendChild(row);
}

function assertTrue(actual, label) {
  assertEqual(!!actual, true, label);
}

function finish() {
  const summary = document.getElementById("summary");
  summary.textContent = `${pass + fail} assertions — ${pass} passed, ${fail} failed`;
  summary.className = fail === 0 ? "all-pass" : "has-fail";
}

// ══════════════════════════════════════════════════════════════════════
// normalisers — malformed and retired-value paths, not just the happy path
// ══════════════════════════════════════════════════════════════════════

section("normalizeType / normalizeKind");
assertEqual(db.normalizeType("container"), "container", "a valid type passes through unchanged");
assertEqual(db.normalizeType("location"), "location", "a valid type passes through unchanged");
assertEqual(db.normalizeType("gadget"), "item", "an unknown type falls back to item, the most general bucket — never throws");
assertEqual(db.normalizeType(undefined), "item", "a missing type falls back to item rather than crashing hydration");
assertEqual(db.normalizeKind("record"), "record", "record passes through");
assertEqual(db.normalizeKind("event"), "event", "the event axis is normalized correctly even though this app never creates one");
assertEqual(db.normalizeKind(undefined), "record", "a missing kind normalizes to record — rows written before the axis existed must read as records");

section("normalizeTitle / normalizeComment / normalizeCategory");
assertEqual(db.normalizeTitle("  Resistor kit  ", 100), "Resistor kit", "titles are trimmed");
assertEqual(db.normalizeTitle("x".repeat(150), 100), "x".repeat(100), "a title longer than the cap is truncated, not rejected");
assertEqual(db.normalizeTitle(42, 100), "", "a non-string title normalizes to empty rather than throwing");
assertEqual(db.normalizeComment("  notes  "), "notes", "comments are trimmed");
assertEqual(db.normalizeCategory("  Displays  "), "displays", "categories are lowercased so 'Displays' and 'displays' are the same filter value");

section("normalizeQuantity");
assertEqual(db.normalizeQuantity(5), 5, "a valid positive integer passes through");
assertEqual(db.normalizeQuantity(0), 1, "zero is not a valid quantity — falls back to 1");
assertEqual(db.normalizeQuantity(-3), 1, "a negative quantity falls back to 1");
assertEqual(db.normalizeQuantity("7"), 7, "a numeric string parses");
assertEqual(db.normalizeQuantity("abc"), 1, "a non-numeric string falls back to 1, not NaN");
assertEqual(db.normalizeQuantity(3.9), 3, "a fractional quantity truncates rather than rounding — a count is always whole");

section("normalizeCode / normalizeStatus / normalizeItemState / normalizeSource");
assertEqual(db.normalizeCode("box-001"), "BOX-001", "codes are uppercased");
assertEqual(db.normalizeCode(" box 001! "), "BOX001", "spaces and punctuation outside A-Z0-9_- are stripped, not rejected");
assertEqual(db.normalizeCode("x".repeat(50)), "X".repeat(32), "codes are capped at 32 characters");
assertEqual(db.normalizeStatus("drafted"), "drafted", "a valid status passes through");
assertEqual(db.normalizeStatus("archived"), "captured", "a retired/unknown status resolves to the safe starting value, captured");
assertEqual(db.normalizeItemState("draft"), "draft", "a valid item state passes through");
assertEqual(db.normalizeItemState("pending"), "confirmed", "an unknown item state falls back to confirmed, not a half-drafted state");
assertEqual(db.normalizeSource("ai"), "ai", "a valid source passes through");
assertEqual(db.normalizeSource("import"), "manual", "an unrecognised source falls back to manual");

section("normalizeTags");
assertEqual(db.normalizeTags(["Cable", "cable", "  Power  "]), ["cable", "power"], "tags are lowercased and deduplicated case-insensitively");
assertEqual(db.normalizeTags(["", "  ", "ok"]), ["ok"], "blank tags are dropped");
assertEqual(db.normalizeTags(Array.from({ length: 30 }, (_, i) => `t${i}`)).length, 20, "the tag list is capped at 20 so one wild import can't blow up every row");
assertEqual(db.normalizeTags("not-an-array"), [], "a non-array value normalizes to an empty list rather than throwing");

section("normalizeLinkedIds");
assertEqual(db.normalizeLinkedIds(["a", "b", "a"]), ["a", "b"], "linkedIds are deduplicated");
assertEqual(db.normalizeLinkedIds(["a", "", 5, null]), ["a"], "non-string / empty entries are dropped");

section("normalizeFields (structured key/value fields)");
{
  const result = db.normalizeFields([{ key: " Part# ", value: " MCP2515 " }]);
  assertEqual({ key: result[0].key, value: result[0].value }, { key: "Part#", value: "MCP2515" }, "key and value are trimmed");
  assertTrue(!!result[0].id, "an id is assigned when missing");
}
assertEqual(db.normalizeFields([{ key: "", value: "x" }]), [], "an entry with no key is dropped — a value with nothing labelling it can't be searched");
{
  const result = db.normalizeFields([{ key: "k", value: "v" }, "garbage", null]);
  assertEqual(result.length, 1, "non-object entries in the array are skipped, not thrown on");
  assertEqual({ key: result[0].key, value: result[0].value }, { key: "k", value: "v" }, "the one well-formed entry survives");
}
assertEqual(db.normalizeFields(Array.from({ length: 60 }, (_, i) => ({ key: `k${i}`, value: "v" }))).length, 40, "fields are capped at 40 per record");
assertEqual(db.normalizeFields([{ key: "k", value: "x".repeat(600) }])[0].value.length, 500, "a field value is capped at 500 characters");

section("normalizeLinks");
assertEqual(db.normalizeLinks([{ label: "Datasheet", url: "https://example.com/ds.pdf" }])[0].url, "https://example.com/ds.pdf", "a well-formed link keeps its url");
assertEqual(db.normalizeLinks([{ label: "bad", url: "" }]), [], "a link with no url is dropped — a link exists to be opened");
assertEqual(db.normalizeLinks([{ url: "https://x.test" }])[0].label, "", "a missing label defaults to empty rather than throwing");

section("normalizeAttachments");
assertEqual(db.normalizeAttachments([{ mediaId: "m1", filename: "a.jpg" }])[0].mediaId, "m1", "a well-formed attachment keeps its mediaId");
assertEqual(db.normalizeAttachments([{ filename: "no-media-id.jpg" }]), [], "an attachment with no mediaId is dropped — it would point at nothing in the media store");
assertEqual(db.normalizeAttachments([{ mediaId: "m1" }])[0].size, 0, "a missing size defaults to 0, not undefined");

section("normalizeUrl / stripTrackingParams");
assertEqual(
  db.stripTrackingParams("https://example.com/x?utm_source=ig&id=42&fbclid=abc"),
  "https://example.com/x?id=42",
  "known tracking params are stripped; the params that actually identify the resource survive",
);
assertEqual(db.stripTrackingParams("https://example.com/x?id=42"), "https://example.com/x?id=42", "a url with nothing to strip round-trips unchanged");
assertEqual(db.stripTrackingParams("not a url at all"), "not a url at all", "an unparsable string is returned trimmed as-is, never thrown on — a bad paste shouldn't crash the save");
assertEqual(db.stripTrackingParams(""), "", "an empty url normalizes to empty");
assertEqual(db.stripTrackingParams(42), "", "a non-string input normalizes to empty rather than throwing");

section("normalizeSearchText / buildHaystack");
assertEqual(db.normalizeSearchText("Weerstand ëën"), "weerstand een", "diacritics are stripped and case is folded, so a plain-ASCII search still finds accented Dutch text");
assertEqual(db.normalizeSearchText("  MCP2515   module "), "mcp2515 module", "whitespace is collapsed and trimmed");
{
  const container = db.hydrateRecord({ type: "container", code: "box-011", title: "CAN bus kit" });
  assertTrue(db.buildHaystack(container).includes("box-011"), "a container's haystack includes its code, lowercased, so 'BOX-011' is findable by typing 'box'");
}
{
  const item = db.hydrateRecord({ type: "item", title: "MCP2515 module", category: "microcontrollers", fields: [{ key: "part", value: "MCP2515-I/P" }] });
  assertTrue(db.buildHaystack(item).includes("mcp2515-i/p"), "an item's haystack includes structured field values — a part number exists to be found");
  assertTrue(db.buildHaystack(item).includes("microcontrollers"), "an item's haystack includes its category");
}
{
  const location = db.hydrateRecord({ type: "location", room: "Bureau Chris", storage: "Hoog Rek Links", section: "Plank 3" });
  assertTrue(db.buildHaystack(location).includes("hoog rek links"), "a location's haystack includes room/storage/section, since that hierarchy IS the searchable content");
}

// ══════════════════════════════════════════════════════════════════════
// hydrateRecord — the read-time migration safety net
// ══════════════════════════════════════════════════════════════════════

section("hydrateRecord");
{
  const r = db.hydrateRecord({});
  assertTrue(!!r.id, "an empty raw record still gets a valid id — hydration never produces an unusable row");
  assertEqual(r.type, "item", "an empty raw record defaults to type item");
  assertEqual(r.deletedAt, null, "deletedAt defaults to null, never a stray string");
  assertEqual(r.tags, [], "tags default to an empty array, never undefined — callers never need a ?? guard");
  assertEqual(r.linkedIds, [], "linkedIds default to an empty array");
  assertEqual(r.fields, [], "fields default to an empty array");
}
{
  const r = db.hydrateRecord({ createdAt: "2026-01-01T00:00:00.000Z" });
  assertEqual(r.updatedAt, r.createdAt, "when updatedAt is missing, it falls back to createdAt — NEVER to now() — or every device would believe it holds the newest copy of everything");
}
{
  const r = db.hydrateRecord(null);
  assertTrue(!!r.id, "hydrateRecord(null) does not throw — it returns a fully-defaulted record");
}
{
  const r = db.hydrateRecord({ type: "container", code: "box-1", status: "retired-value", quantity: -5 });
  assertEqual(r.code, "BOX-1", "a container's code is normalized on hydration");
  assertEqual(r.status, "captured", "a retired status value resolves to the current default rather than falling through to undefined");
  assertTrue(!("quantity" in r), "a container record carries no item-only fields");
}
{
  const r = db.hydrateRecord({ type: "item", quantity: "12", category: "  Cables  ", state: "draft", source: "ai" });
  assertEqual(r.quantity, 12, "an item's quantity is normalized on hydration");
  assertEqual(r.category, "cables", "an item's category is normalized on hydration");
  assertEqual(r.state, "draft", "a valid item state survives hydration");
}
{
  const r = db.hydrateRecord({ type: "location", room: "  Office  ", storage: "", section: "" });
  assertEqual(r.room, "Office", "a location's room is trimmed on hydration");
  assertEqual(r.storage, "", "an empty optional location level stays empty, not null — 26 of the real shelf map's locations have no storage/section level");
}

section("makeRecord");
{
  const r1 = db.makeRecord({ type: "container", code: "box-2" });
  assertEqual(r1.createdAt, r1.updatedAt, "a freshly made record has createdAt === updatedAt");
  assertEqual(r1.code, "BOX-2", "makeRecord runs fields through the same normalization as hydrateRecord — one source of truth for a valid record");
  const r2 = db.makeRecord({ type: "container", code: "box-2" });
  assertTrue(r1.id !== r2.id, "two records made separately never share an id");
}

// ══════════════════════════════════════════════════════════════════════
// query engine
// ══════════════════════════════════════════════════════════════════════

section("makeComparator");
{
  const rows = [{ title: "BOX-2" }, { title: "BOX-10" }, { title: "BOX-1" }];
  const sorted = [...rows].sort(db.makeComparator("title", "asc"));
  assertEqual(
    sorted.map((r) => r.title),
    ["BOX-1", "BOX-2", "BOX-10"],
    "sorting is natural/numeric-aware — BOX-10 sorts after BOX-2, not between BOX-1 and BOX-2 as a plain string sort would",
  );
}
{
  const rows = [{ title: "b", pinned: false }, { title: "a", pinned: true }];
  const sorted = [...rows].sort(db.makeComparator("title", "asc", true));
  assertEqual(sorted.map((r) => r.title), ["a", "b"], "pinnedFirst puts a pinned record ahead of an alphabetically-earlier one");
}

section("queryItemSet");
{
  const items = [
    db.hydrateRecord({ id: "loc-1", type: "location", room: "Office", storage: "Cupboard" }),
    db.hydrateRecord({ id: "c-1", type: "container", code: "BOX-001", title: "Cables", linkedIds: ["loc-1"] }),
    db.hydrateRecord({ id: "c-2", type: "container", code: "BOX-002", title: "Sensors", linkedIds: [] }),
    db.hydrateRecord({ id: "i-1", type: "item", title: "USB cable", category: "cables", linkedIds: ["c-1"], tags: ["usb"] }),
    db.hydrateRecord({ id: "i-2", type: "item", title: "PIR sensor", category: "sensors", state: "draft", linkedIds: ["c-2"] }),
    { ...db.hydrateRecord({ id: "i-3", type: "item", title: "Deleted thing", linkedIds: ["c-2"] }), deletedAt: "2026-01-01T00:00:00.000Z" },
  ];

  assertEqual(db.queryItemSet(items, {}).total, 5, "a deleted record is excluded from the default query — trash is opt-in, not opt-out");
  assertEqual(db.queryItemSet(items, { onlyDeleted: true }).total, 1, "onlyDeleted returns exactly the tombstoned record");
  assertEqual(db.queryItemSet(items, { type: "item" }).total, 2, "filtering by type returns only that type");
  assertEqual(
    db.queryItemSet(items, { linkedId: "c-2" }).results.map((r) => r.id).sort(),
    ["i-2"],
    "linkedId filters to records that reference that id — 'items in this container'",
  );
  assertEqual(db.queryItemSet(items, { category: "Cables" }).total, 1, "category filtering is case-insensitive");
  assertEqual(db.queryItemSet(items, { itemState: "draft" }).total, 1, "itemState filters items by draft/confirmed");
  assertEqual(db.queryItemSet(items, { tags: ["usb"] }).total, 1, "tag filtering matches records carrying any of the given tags");
  assertEqual(db.queryItemSet(items, { search: "sensor" }).total, 2, "a text search matches both the sensor container and the sensor item");
  assertEqual(db.queryItemSet(items, { search: "cupboard" }).total, 1, "a text search reaches into a location's storage field");

  const paged = db.queryItemSet(items, { sortBy: "title", sortDir: "asc", offset: 1, limit: 2 });
  assertEqual(paged.results.length, 2, "limit caps the page size");
  assertEqual(paged.total, 5, "total reflects the full filtered set, not just the current page");
  assertTrue(paged.hasMore, "hasMore is true when offset + limit < total");
  const lastPage = db.queryItemSet(items, { sortBy: "title", sortDir: "asc", offset: 4, limit: 2 });
  assertTrue(!lastPage.hasMore, "hasMore is false once the page reaches the end of the filtered set");
}

// ══════════════════════════════════════════════════════════════════════
// revision history — diff / restore / key ranges
// ══════════════════════════════════════════════════════════════════════

section("diffRecords / applyVersion");
{
  const a = db.hydrateRecord({ id: "x", type: "item", title: "Old name", quantity: 2, updatedAt: "2026-01-01T00:00:00.000Z" });
  const b = db.hydrateRecord({ id: "x", type: "item", title: "New name", quantity: 2, updatedAt: "2026-02-01T00:00:00.000Z" });
  const diff = db.diffRecords(a, b);
  assertTrue("title" in diff, "a changed diffable field appears in the diff");
  assertTrue(!("quantity" in diff), "an unchanged field never appears in the diff");
  assertTrue(!("updatedAt" in diff), "envelope timestamps are never diffed — they are bookkeeping, not content");

  const restored = db.applyVersion(b, a);
  assertEqual(restored.title, "Old name", "applyVersion restores the diffable field from the snapshot");
  assertEqual(restored.id, "x", "applyVersion never changes the id — restoring is an edit under the same identity, not a new record");
  assertEqual(restored.updatedAt, b.updatedAt, "applyVersion leaves updatedAt untouched — the caller's normal write path bumps it");
}
{
  const same = db.hydrateRecord({ id: "y", type: "item", title: "Same" });
  assertEqual(db.diffRecords(same, same), {}, "diffing a record against itself produces an empty diff");
}

section("versionKey / versionKeyRange");
assertEqual(db.versionKey("abc", 0), "abc#000000", "sequence numbers are zero-padded so lexicographic order matches chronological order");
assertEqual(db.versionKey("abc", 12), "abc#000012", "padding is stable across sequence numbers");
{
  const range = db.versionKeyRange("abc");
  assertTrue(range.includes("abc#000000"), "a version key for this record falls inside its own range");
  assertTrue(!range.includes("abc1#000000"), "a different record whose id happens to share this one as a prefix is excluded — the '#' separator sorts before every key character");
}

section("locationPath / nextCode");
assertEqual(db.locationPath({ room: "Office", storage: "Cupboard", section: "", title: "Shelf 1" }), "Office › Cupboard › Shelf 1", "blank levels are skipped, not rendered as empty segments");
assertEqual(db.locationPath(null), "", "a missing location renders as an empty string, not a crash — a container can point at a deleted location");
assertEqual(db.nextCode([], "BOX"), "BOX-001", "the first code for a prefix starts at 001");
assertEqual(db.nextCode(["BOX-001", "BOX-002", "BOX-010"], "BOX"), "BOX-011", "the next code continues from the highest existing number, not the count of codes");
assertEqual(db.nextCode(["BOX-005", "BAG-002"], "BAG"), "BAG-003", "codes under a different prefix are ignored");
assertEqual(db.nextCode(["box-9"], "box"), "BOX-010", "prefix matching is case-insensitive since codes are always normalized uppercase");

section("expandNameRange");
assertEqual(db.expandNameRange("RIJ {n}", 1, 5), ["RIJ 1", "RIJ 2", "RIJ 3", "RIJ 4", "RIJ 5"], "a pattern containing {n} expands over the inclusive from..to range");
assertEqual(db.expandNameRange("RIJ {n}", "3", "3"), ["RIJ 3"], "a single-value range (from === to) still produces one name — numeric strings from form inputs work the same as numbers");
assertEqual(db.expandNameRange("Plank", 1, 5), [], "a pattern with no {n} token produces nothing — there is no sequence number to vary, so silently repeating the same name 5 times would be wrong");
assertEqual(db.expandNameRange("RIJ {n}", 5, 1), [], "a 'to' before 'from' produces nothing rather than counting backwards unexpectedly");
assertEqual(db.expandNameRange("RIJ {n}", "abc", 5), [], "a non-numeric bound produces nothing rather than NaN-based names");
assertEqual(db.expandNameRange("RIJ {n}", 1, 10000).length, 200, "the range is capped (default 200) so a typo in the 'to' field can't silently queue a huge batch write");
assertEqual(db.expandNameRange("RIJ {n}", 1, 3, 2).length, 2, "the cap is overridable via the max parameter");

section("appendActivity");
{
  let log = [];
  for (let i = 0; i < 5; i++) log = db.appendActivity(log, { n: i }, 3);
  assertEqual(log.map((e) => e.n), [2, 3, 4], "the ring buffer keeps only the newest `cap` entries, oldest dropped first");
}
assertEqual(db.appendActivity([], { n: 1 }, 60).length, 1, "appending to an empty log works");

// ══════════════════════════════════════════════════════════════════════
// i18n — key parity between languages (cheap, prevents a raw key rendering)
// ══════════════════════════════════════════════════════════════════════

section("i18n dictionary parity");
{
  const { nl, en } = dictionaryKeys();
  const onlyNl = nl.filter((k) => !en.includes(k));
  const onlyEn = en.filter((k) => !nl.includes(k));
  assertEqual(onlyNl, [], "every NL key also exists in EN — a missing translation would render as its own key name");
  assertEqual(onlyEn, [], "every EN key also exists in NL");
}

// ══════════════════════════════════════════════════════════════════════
// markdown.js — rendering correctness + XSS safety
// ══════════════════════════════════════════════════════════════════════

section("markdown render — block structure");
assertEqual(render("# Heading"), "<h1>Heading</h1>", "a single # produces an h1");
assertEqual(render("## Sub"), "<h2>Sub</h2>", "## produces an h2");
assertEqual(render("### Deep"), "<h3>Deep</h3>", "### produces an h3");
assertEqual(render("Just text"), "<p>Just text</p>", "a plain line becomes a paragraph");
assertEqual(
  render("- one\n- two"),
  "<ul>\n<li>one</li>\n<li>two</li>\n</ul>",
  "consecutive bullet lines are wrapped in a single <ul>, not one per line",
);
assertEqual(
  render("- one\n\ntext after"),
  "<ul>\n<li>one</li>\n</ul>\n<p>text after</p>",
  "a blank line closes an open list before the next paragraph starts",
);
assertEqual(render("para one\n\npara two"), "<p>para one</p>\n<p>para two</p>", "a blank line separates two paragraphs");

section("markdown render — inline formatting");
assertEqual(render("**bold**"), "<p><strong>bold</strong></p>", "**text** becomes <strong>");
assertEqual(render("*italic*"), "<p><em>italic</em></p>", "*text* becomes <em>");
assertEqual(render("_italic_"), "<p><em>italic</em></p>", "_text_ also becomes <em>");
assertEqual(render("`code`"), "<p><code>code</code></p>", "`text` becomes <code>");
assertEqual(
  render("`**not bold**`"),
  "<p><code>**not bold**</code></p>",
  "code spans are protected first — markup characters inside backticks are never reinterpreted",
);
assertEqual(
  render("[Anthropic](https://anthropic.com)"),
  '<p><a href="https://anthropic.com" target="_blank" rel="noreferrer">Anthropic</a></p>',
  "a link with a safe https url renders as a real anchor",
);

section("markdown render — XSS safety");
// NOTE: every literal script tag below is written as "<scr" + "ipt>" — the
// literal characters "<\/script>" anywhere in this file, even inside a JS
// string, terminate the real enclosing <script type="module"> block early
// (the HTML parser doesn't know about JS string boundaries).
const RAW_SCRIPT = "<scr" + "ipt>alert(1)</scr" + "ipt>";
assertTrue(
  !render(RAW_SCRIPT).includes("<scr" + "ipt>"),
  "a raw script tag in the source is never passed through unescaped",
);
assertEqual(
  render(RAW_SCRIPT),
  "<p>&lt;scr" + "ipt&gt;alert(1)&lt;/scr" + "ipt&gt;</p>",
  "a raw script tag renders as inert escaped text, wrapped as a normal paragraph",
);
assertEqual(
  render("[click me](javascript:alert(1))"),
  "<p>click me</p>",
  "a javascript: url is rejected — the link degrades to plain text rather than becoming a live anchor",
);
assertTrue(
  !render('[x](https://evil.test/"onmouseover="alert(1))').includes('"onmouseover="'),
  "a quote embedded in a link url can never break out of the href attribute, since the whole line is HTML-escaped before urls are extracted",
);
assertTrue(
  !render("[x](data:text/html," + RAW_SCRIPT + ")").includes("<a "),
  "a data: url is rejected just like javascript: — only http(s)/mailto/relative links are ever linkified",
);

// ══════════════════════════════════════════════════════════════════════
// report.js — insights + export/print builders
// ══════════════════════════════════════════════════════════════════════

section("computeStats");
{
  const items = [
    { id: "l1", type: "location" },
    { id: "c1", type: "container", status: "confirmed", pinned: true },
    { id: "c2", type: "container", status: "drafted" },
    { id: "i1", type: "item", category: "cables", quantity: 3, state: "confirmed" },
    { id: "i2", type: "item", category: "cables", quantity: 1, state: "draft" },
    { id: "i3", type: "item", category: "sensors", quantity: 2, state: "confirmed" },
    { id: "i4", type: "item", category: "", quantity: 1, state: "confirmed", deletedAt: "2026-01-01T00:00:00.000Z" },
  ];
  const stats = report.computeStats(items);
  assertEqual(stats.locations, 1, "location count excludes non-location records");
  assertEqual(stats.containers.total, 2, "container count includes both statuses");
  assertEqual(stats.items.total, 3, "a deleted item is excluded from the live item count");
  assertEqual(stats.items.totalQuantity, 6, "total quantity sums only live items (3+1+2)");
  assertEqual(stats.items.draftCount, 1, "draft count reflects only live draft items");
  assertEqual(stats.pinned, 1, "pinned count reflects live pinned records of any type");
  assertEqual(
    stats.items.byCategory,
    [{ category: "cables", count: 2 }, { category: "sensors", count: 1 }],
    "byCategory is sorted by count descending, most common category first",
  );
}

section("bucketItemsByWeek");
{
  const today = "2026-03-15T12:00:00.000Z"; // a Sunday, so bucket math is exercised mid-week too
  const items = [
    { type: "item", createdAt: "2026-03-14T00:00:00.000Z" }, // this week
    { type: "item", createdAt: "2026-03-01T00:00:00.000Z" }, // ~2 weeks ago
    { type: "item", createdAt: "2020-01-01T00:00:00.000Z" }, // way out of range
    { type: "item", createdAt: "2026-03-14T00:00:00.000Z", deletedAt: "2026-03-14T00:00:00.000Z" }, // deleted, excluded
  ];
  const buckets = report.bucketItemsByWeek(items, 4, { today });
  assertEqual(buckets.length, 4, "the requested number of weekly buckets is always returned, even mostly empty");
  const total = buckets.reduce((sum, b) => sum + b.count, 0);
  assertEqual(total, 2, "an out-of-range item and a deleted item are both excluded from every bucket");
  assertTrue(buckets[3].count >= 1, "an item created this week lands in the most recent (last) bucket");
}

section("sortTagsByRecency");
{

// ══════════════════════════════════════════════════════════════════════
// merge.js — two-way sync conflict resolution (pure, unit-tested FIRST
// per BLUEPRINT.md §7 — a bug here is silent and ships straight to Drive)
// ══════════════════════════════════════════════════════════════════════

section("resolveRecord — tombstone-wins / last-write-wins");
{
  const live = { id: "x", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" };
  const liveNewer = { id: "x", deletedAt: null, updatedAt: "2026-02-01T00:00:00.000Z" };
  const tomb = { id: "x", deletedAt: "2026-01-15T00:00:00.000Z", updatedAt: "2026-01-15T00:00:00.000Z" };
  const tombNewer = { id: "x", deletedAt: "2026-03-01T00:00:00.000Z", updatedAt: "2026-03-01T00:00:00.000Z" };

  assertEqual(merge.resolveRecord(null, live), live, "a missing local copy resolves to whatever remote has — first sync of a record from another device");
  assertEqual(merge.resolveRecord(live, null), live, "a missing remote copy resolves to the local copy — a record remote has never seen yet");
  assertEqual(merge.resolveRecord(live, liveNewer), liveNewer, "between two live copies, the newer updatedAt wins");
  assertEqual(merge.resolveRecord(liveNewer, live), liveNewer, "order of arguments doesn't matter — newer always wins");
  assertEqual(
    merge.resolveRecord(tomb, liveNewer),
    tomb,
    "a tombstone wins even against a LIVE record with a newer updatedAt — otherwise a concurrent edit elsewhere would resurrect something this device deleted, and the delete would never propagate",
  );
  assertEqual(
    merge.resolveRecord(liveNewer, tomb),
    tomb,
    "tombstone-wins holds regardless of argument order",
  );
  assertEqual(merge.resolveRecord(tomb, tombNewer), tombNewer, "between two tombstones, the newer updatedAt wins (so a later un-delete-then-redelete elsewhere still lands correctly)");
  assertEqual(merge.resolveRecord(live, live), live, "resolving a record against an identical copy of itself is a no-op");
}

section("mergeItemSets");
{
  const local = [
    { id: "only-local", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
    { id: "both-same", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
    { id: "both-remote-newer", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
    { id: "remote-deletes-it", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
  ];
  const remote = [
    { id: "only-remote", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
    { id: "both-same", deletedAt: null, updatedAt: "2026-01-01T00:00:00.000Z" },
    { id: "both-remote-newer", deletedAt: null, updatedAt: "2026-02-01T00:00:00.000Z" },
    { id: "remote-deletes-it", deletedAt: "2026-02-01T00:00:00.000Z", updatedAt: "2026-02-01T00:00:00.000Z" },
  ];

  const { merged, stats } = merge.mergeItemSets(local, remote);

  assertEqual(merged.length, 5, "the merged set is the union of every id seen on either side — 5 distinct ids across local and remote");
  assertEqual(stats, { added: 1, updated: 1, deleted: 1 }, "stats describe what this merge is about to CHANGE locally: one brand-new record, one plain content update, one newly-tombstoned record, and one record left untouched");

  const byId = new Map(merged.map((r) => [r.id, r]));
  assertTrue(!!byId.get("only-local"), "a record that only exists locally survives the merge untouched");
  assertTrue(!!byId.get("only-remote"), "a record that only exists remotely is added to the merged set");
  assertEqual(byId.get("both-remote-newer").updatedAt, "2026-02-01T00:00:00.000Z", "when both sides have a record, the newer-updatedAt version is the one that survives into the merged set");
  assertTrue(!!byId.get("remote-deletes-it").deletedAt, "a remote deletion is reflected in the merged set as a tombstone");
}
{
  const { merged, stats } = merge.mergeItemSets([], []);
  assertEqual(merged, [], "merging two empty sets (first sync ever, both sides) produces an empty set, not an error");
  assertEqual(stats, { added: 0, updated: 0, deleted: 0 }, "stats are all zero when there is nothing to merge");
}

section("computeMediaActions");
{
  const merged = [
    { id: "r1", deletedAt: null, attachments: [{ mediaId: "m-local-only" }] },
    { id: "r2", deletedAt: null, attachments: [{ mediaId: "m-remote-only" }] },
    { id: "r3", deletedAt: null, attachments: [{ mediaId: "m-both" }] },
    // this record is DELETED, so its attachment must not keep its media alive
    { id: "r4", deletedAt: "2026-01-01T00:00:00.000Z", attachments: [{ mediaId: "m-orphaned-by-delete" }] },
  ];
  const localMediaIds = ["m-local-only", "m-both", "m-unreferenced-local"];
  const remoteMediaNames = ["m-remote-only__photo.jpg", "m-both__spec.pdf", "m-orphaned-by-delete__old.jpg"];

  const actions = merge.computeMediaActions(merged, localMediaIds, remoteMediaNames);

  assertEqual(actions.toUpload, ["m-local-only"], "a blob that exists locally, is referenced by a live record, but has no Drive file yet needs uploading");
  assertEqual(actions.toDownload, ["m-remote-only"], "a blob referenced by a live record that exists on Drive but not locally needs downloading");
  assertEqual(actions.toDeleteLocal, ["m-unreferenced-local"], "a local blob no live record references anymore is an orphan and gets deleted locally");
  assertEqual(
    actions.toDeleteRemoteNames,
    ["m-orphaned-by-delete__old.jpg"],
    "a Drive file whose record was deleted gets removed from Drive too, matched by the '<mediaId>__' filename prefix",
  );
}
{
  // The local blob for a deleted record's attachment is USUALLY already
  // gone (local deletion purges it within seconds) — the Drive-side delete
  // must never be gated on it still being present locally, or the Drive
  // copy orphans forever (a real bug documented in BLUEPRINT.md §7).
  const merged = [{ id: "r1", deletedAt: "2026-01-01T00:00:00.000Z", attachments: [{ mediaId: "m1" }] }];
  const actions = merge.computeMediaActions(merged, [], ["m1__photo.jpg"]);
  assertEqual(actions.toDeleteRemoteNames, ["m1__photo.jpg"], "the Drive file is queued for deletion even though the local blob is already gone — deletion is driven only by whether any live record still wants it");
}
{
  const actions = merge.computeMediaActions([], [], []);
  assertEqual(actions, { toUpload: [], toDownload: [], toDeleteLocal: [], toDeleteRemoteNames: [] }, "no records and no media anywhere produces no actions at all");
}

// sync.js — the payload guard + multipart body builder (its only pure,
// I/O-free exports; everything else needs a real Drive connection)
// ══════════════════════════════════════════════════════════════════════

section("parseItemsPayload — the payload guard (§7)");
assertEqual(parseItemsPayload(""), { ok: true, items: [] }, "an empty body (first sync, nothing uploaded yet) is the one benign empty case");
assertEqual(parseItemsPayload("   "), { ok: true, items: [] }, "whitespace-only counts as empty too");
assertEqual(
  parseItemsPayload(JSON.stringify({ v: 1, items: [{ id: "a" }] })),
  { ok: true, items: [{ id: "a" }] },
  "a well-formed current-version payload parses through",
);
assertEqual(
  parseItemsPayload("{not valid json"),
  { ok: false, reason: "unreadable", detail: "payload is not valid JSON" },
  "garbage/corrupt JSON is refused outright — never silently treated as an empty remote, which would let a write-back overwrite real data with nothing",
);
assertEqual(
  parseItemsPayload("[1,2,3]"),
  { ok: false, reason: "unreadable", detail: "payload is not a JSON object" },
  "a bare JSON array (not the {v, items} envelope) is refused, not misread as a bare item list",
);
assertEqual(
  parseItemsPayload(JSON.stringify({ v: 99, items: [] })),
  { ok: false, reason: "unsupported-format", detail: "payload is wire version 99, this build only reads version 1" },
  "a future/unknown wire version is refused and named, per the guard's whole purpose — an old build must abort rather than guess",
);
assertEqual(
  parseItemsPayload(JSON.stringify({ v: 1 })),
  { ok: false, reason: "unreadable", detail: "payload has no items array" },
  "a correctly-versioned envelope missing its items array is still refused, not treated as an empty list");

section("buildMultipartBody");
{
  const body = buildMultipartBody({ name: "items.json" }, '{"v":1,"items":[]}', "application/json");
  assertTrue(body.includes("inventory-sync-boundary"), "the body is delimited by the declared boundary string");
  assertTrue(body.includes('{"name":"items.json"}'), "the metadata part carries the file's Drive metadata as JSON");
  assertTrue(body.includes('{"v":1,"items":[]}'), "the content part carries the actual file body verbatim");
  assertTrue(body.trim().endsWith("--inventory-sync-boundary--"), "the body is terminated by the closing boundary marker Drive's multipart parser requires");
}
